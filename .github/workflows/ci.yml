name: Validate and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/CoracaoAnimal.Tests -c Release --logger trx
      - run: dotnet publish src/CoracaoAnimal.Api -c Release -o artifacts/web
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: artifacts/web
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: dotnet workload install maui-android
      - run: dotnet build src/CoracaoAnimal.App -c Debug -t:SignAndroidPackage
      - uses: actions/upload-artifact@v4
        with:
          name: android-test
          path: src/CoracaoAnimal.App/bin/Debug/net10.0-android/*Signed.apk
