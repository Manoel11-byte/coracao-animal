name: Validate and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/CoracaoAnimal.Tests -c Release --logger trx
      - name: Verify provisioning safety
        shell: pwsh
        run: ./tests/deploy-safety.ps1
      - name: Audit dependencies
        run: |
          dotnet list tests/CoracaoAnimal.Tests package --no-restore --vulnerable --include-transitive --format json > dependency-audit.json
          python tests/check-dependency-audit.py dependency-audit.json
      - run: pip install -r scripts/requirements-site.txt
      - run: python scripts/import-original-site.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-review-evidence
          path: artifacts/review/*.png
      - run: dotnet publish src/CoracaoAnimal.Api -c Release -o artifacts/web
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: artifacts/web
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify Windows startup
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/windows/CoracaoAnimal.exe -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) { throw "O executável encerrou na inicialização: $($process.ExitCode)" }
            Write-Output "PASS: executável Windows permaneceu aberto após a inicialização."
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: dotnet workload install maui-android
      - run: dotnet build src/CoracaoAnimal.App -c Release -t:SignAndroidPackage
      - name: Audit Android dependencies
        run: |
          dotnet list src/CoracaoAnimal.App package --no-restore --vulnerable --include-transitive --format json > android-dependency-audit.json
          python tests/check-dependency-audit.py android-dependency-audit.json
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python tests/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-review
          path: artifacts/android-review
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: src/CoracaoAnimal.App/bin/Release/net10.0-android/*Signed.apk
