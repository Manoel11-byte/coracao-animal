name: Validate and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/CoracaoAnimal.Tests -c Release --logger trx
      - run: pip install -r scripts/requirements-site.txt
      - run: python scripts/import-original-site.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-review-evidence
          path: artifacts/review/*.png
      - run: dotnet publish src/CoracaoAnimal.Api -c Release -o artifacts/web
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: artifacts/web
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify Windows startup
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/windows/CoracaoAnimal.exe -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) { throw "O executável encerrou na inicialização: $($process.ExitCode)" }
            Write-Output "PASS: executável Windows permaneceu aberto após a inicialização."
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: dotnet workload install maui-android
      - run: dotnet build src/CoracaoAnimal.App -c Release -t:SignAndroidPackage
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: src/CoracaoAnimal.App/bin/Release/net10.0-android/*Signed.apk
